<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team Palinoia</title>
    <link rel="stylesheet" href="style/common.css">
    <link rel="stylesheet" href="style/contact.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <div class="logo-wrapper"><img src="assets/logo.jpeg" alt="Logo" class="logo"></div>
        <a href="team.html">Team</a>
        <a href="contact.html">Contact Us</a>
        <a href="login.html" class="nav-action" title="Login">
            <span class="nav-action-text">Team Login</span>
        </a>
    </nav>

    <main class="form-page auth-page">
        <div class="auth-graphic auth-left">
            <img src="assets/left_dancer.png" alt="Aesthetic Graphic">
        </div>
        <div class="form-container">
            <div class="form-logo"><img src="assets/logo.jpeg" alt="Logo"></div>
            <h2>Member Login</h2>
            <form id="loginForm" action="php/login.php" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
        <div class="auth-graphic auth-right">
            <img src="assets/right_dancer.png" alt="Aesthetic Graphic">
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Team Palinoia. All rights reserved.
    </footer>

</body>

</html>
